version: "3.9"

services:
  ml-service:
    build:
      context: .
      dockerfile: Dockerfile
    expose:
      - "5000"
    container_name: credit-card-ml
    environment:
      AB_TEST_ENABLED: "true"
      AB_SPLIT_RATIO: "0.5"
      AB_HASH_FIELD: "customer_id"
      LOG_LEVEL: "INFO"

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - ml-service
    container_name: credit-card-ml-nginx
